name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to a pull request supersedes its running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract VersionCode
        id: extract_vc
        run: |
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | sed 's/.*versionCode = \(.*\)/\1/' | tr -d ' ')
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Extracted versionCode: $VERSION_CODE"

      - name: Check changelogs
        run: |
          for lang in en-US de-DE; do
            file="fastlane/metadata/android/$lang/changelogs/${{ env.VERSION_CODE }}.txt"
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Missing $lang changelog (versionCode ${{ env.VERSION_CODE }})"
              exit 1
            fi
            echo "✔ Found changelog: $file"
          done

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run linters
        run: ./gradlew lintDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Compile the instrumented APKs once; the device jobs reuse these outputs from the build cache.
      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Upload Gradle build cache
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-cache
          path: ~/.gradle/caches/build-cache-1
          include-hidden-files: true
          retention-days: 1

      - name: Upload Unit Test Results (XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Upload Lint Report (HTML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-debug-html
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload Lint Report (XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-debug-xml
          path: app/build/reports/lint-results-debug.xml
          retention-days: 7

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## CI Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Lint Report (Debug)" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/reports/lint-results-debug.html ]; then
            echo "Lint issues may have been found. Download the HTML report from the artifacts section of this run." >> $GITHUB_STEP_SUMMARY
            echo "- [Download Lint Report (HTML)](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> $GITHUB_STEP_SUMMARY
          else
            echo "No Lint HTML report found or lint task failed to produce one." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Unit Test Summary Table
          echo "### Unit Test Results" >> $GITHUB_STEP_SUMMARY
          UNIT_REPORTS=$(find app/build/test-results/testDebugUnitTest -name "TEST-*.xml" 2>/dev/null)
          if [[ -n "$UNIT_REPORTS" ]]; then
            echo "| Suite | Total | ✅ Pass | 🔴 Fail | ⚪ Skip | ⏱️ Duration (s) |" >> $GITHUB_STEP_SUMMARY
            echo "| ----- | -----: | ------: | ------: | -----: | ----------: |" >> $GITHUB_STEP_SUMMARY
            GRAND_TOTAL=0; GRAND_PASS=0; GRAND_FAIL=0; GRAND_SKIP=0
            while IFS= read -r REPORT; do
              NAME=$(grep -oP '<testsuite[^>]* name="\K[^"]+' "$REPORT" | head -1)
              TOTAL=$(grep -oP 'tests="\K[0-9]+' "$REPORT" | head -1); TOTAL=${TOTAL:-0}
              FAIL=$(grep -oP 'failures="\K[0-9]+' "$REPORT" | head -1); FAIL=${FAIL:-0}
              ERR=$(grep -oP 'errors="\K[0-9]+' "$REPORT" | head -1); ERR=${ERR:-0}
              SKIP=$(grep -oP 'skipped="\K[0-9]+' "$REPORT" | head -1); SKIP=${SKIP:-0}
              TIME=$(grep -oP 'time="\K[0-9.]+' "$REPORT" | head -1)
              FAIL_TOT=$((FAIL + ERR))
              PASSED=$((TOTAL - FAIL_TOT - SKIP))
              echo "| $NAME | $TOTAL | $PASSED | $FAIL_TOT | $SKIP | $TIME |" >> $GITHUB_STEP_SUMMARY
              GRAND_TOTAL=$((GRAND_TOTAL + TOTAL))
              GRAND_PASS=$((GRAND_PASS + PASSED))
              GRAND_FAIL=$((GRAND_FAIL + FAIL_TOT))
              GRAND_SKIP=$((GRAND_SKIP + SKIP))
            done <<< "$UNIT_REPORTS"
            echo "| **Total** | **$GRAND_TOTAL** | **$GRAND_PASS** | **$GRAND_FAIL** | **$GRAND_SKIP** | — |" >> $GITHUB_STEP_SUMMARY
          else
            echo "_No unit test results found._" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Changelog Status
          echo "### Changelog Status (versionCode: ${{ env.VERSION_CODE }})" >> $GITHUB_STEP_SUMMARY
          if [ -f "fastlane/metadata/android/en-US/changelogs/${{ env.VERSION_CODE }}.txt" ]; then
            echo "- ✅ en-US Changelog: Found" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ en-US Changelog: NOT Found" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "fastlane/metadata/android/de-DE/changelogs/${{ env.VERSION_CODE }}.txt" ]; then
            echo "- ✅ de-DE Changelog: Found" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ de-DE Changelog: NOT Found" >> $GITHUB_STEP_SUMMARY
          fi

  instrumented-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    # The full suite takes close to 25 minutes on the emulator, plus build and boot.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 35 ]
        profile: [ "Nexus 6", "Nexus 10", "7.6in Foldable" ]
        # The phone runs the full suite; larger windows only change @AdaptiveLayout classes.
        include:
          - profile: "Nexus 10"
            test-filter: -Pandroid.testInstrumentationRunnerArguments.annotation=com.rbn.qtsettings.AdaptiveLayout
          - profile: "7.6in Foldable"
            test-filter: -Pandroid.testInstrumentationRunnerArguments.annotation=com.rbn.qtsettings.AdaptiveLayout

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Download Gradle build cache
        uses: actions/download-artifact@v7
        with:
          name: gradle-build-cache
          path: ~/.gradle/caches/build-cache-1

      - name: Make gradlew executable (+ normalize endings)
        run: |
          chmod +x ./gradlew
          if command -v dos2unix >/dev/null; then dos2unix ./gradlew || true; fi

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # The API-35 AVD needs several GB; this Kotlin-only app uses neither the NDK nor .NET.
      - name: Free disk space for the emulator
        run: sudo rm -rf "${ANDROID_HOME:?}/ndk" /usr/share/dotnet

      - name: Cache AVD
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api-${{ matrix.api-level }}-default-x86_64-gestural-noerrdialog-profile-${{ matrix.profile }}

      # Bake device settings into the snapshot and save it only once the launcher is settled.
      # Switching navigation mode restarts System UI and the launcher; doing that right before
      # the tests left another window holding input focus for the whole run.
      - name: Generate AVD snapshot for API ${{ matrix.api-level }} on ${{ matrix.profile }}
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          disable-animations: false
          # emulator-runner sends `input keyevent 82` right after boot to leave the lock screen. On a
          # cold boot it can arrive too early and leave the keyguard focused, so disable the keyguard.
          # The same event can make the launcher or System UI ANR before the first line below hides
          # error dialogs; the wait loops close such a dialog, and later ANRs restart the process.
          # Predictive-back tests need real gestural navigation; IME tests need the soft keyboard.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell svc power stayon true
            adb shell locksettings set-disabled true
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural
            timeout 60 adb shell 'until [ "$(settings get secure navigation_mode)" = 2 ]; do sleep 1; done'
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.HOME
            timeout 300 adb shell 'until dumpsys window | grep -q "mCurrentFocus=.*launcher3/"; do wm dismiss-keyguard; am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null; sleep 2; done' || { adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'; exit 1; }
            sleep 30
            adb shell dumpsys window | grep -E 'mCurrentFocus=.*launcher3/' || { adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'; exit 1; }

      - name: Run Instrumented Tests on API ${{ matrix.api-level }} on ${{ matrix.profile }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_FILTER: ${{ matrix.test-filter }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          # Fail fast if a system window (e.g. an ANR dialog) holds focus instead of the launcher.
          # On failure, pull the window-focus screenshots written by DialogWindowTestHelper.
          script: |
            timeout 180 adb shell 'until dumpsys window | grep -q "mCurrentFocus=.*launcher3/"; do wm dismiss-keyguard; am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null; sleep 2; done' || { adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'; exit 1; }
            timeout --preserve-status 40m ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notAnnotation=com.rbn.qtsettings.ScreenshotLane $TEST_FILTER || { adb pull /sdcard/Download/qt-ci-diagnostics app/build/outputs/androidTest-results/connected/ci-diagnostics; exit 1; }

      - name: Summarize Instrumented Test Results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: app/build/outputs/androidTest-results/connected/**/TEST-*.xml
          check_name: Instrumented Tests (API ${{ matrix.api-level }} - ${{ matrix.profile }})
          annotate_only: true
          detailed_summary: true
          require_tests: true

      - name: Upload Instrumented Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results-api-${{ matrix.api-level }}-${{ matrix.profile }}
          path: |
            app/build/reports/androidTests/connected/**/*
            app/build/outputs/androidTest-results/connected/**/*
          retention-days: 7
